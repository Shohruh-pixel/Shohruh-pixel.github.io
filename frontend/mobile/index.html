<style>
/* Values are the mock's own, read out of its editable parameters rather than sampled from a
   screenshot. Everything is a film of the text colour over a near-black ground: no solid fills,
   because a screen of eight bank cards has to read as one surface, not eight boxes. */
:root{
  --bg:#0b0d15; --glass:rgba(242,244,250,.05); --glass-soft:rgba(242,244,250,.032);
  --edge:inset 0 1px 0 rgba(242,244,250,.09), 0 0 0 1px rgba(242,244,250,.055);
  --edge-lit:inset 0 1px 0 rgba(242,244,250,.14), 0 0 0 1px rgba(242,244,250,.07), 0 20px 46px rgba(0,0,0,.4);
  --acc:#6ee7ff; --acc-wash:rgba(110,231,255,.1);
  --acc-edge:inset 0 1px 0 rgba(110,231,255,.3), 0 0 0 1px rgba(110,231,255,.34), 0 0 22px rgba(110,231,255,.16);
  --text:#f2f4fa; --dim:#a4aabd; --faint:#8b91a4; --rad:22px;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono","Roboto Mono",monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overscroll-behavior:none}
body{touch-action:manipulation;overscroll-behavior:none}
/* Controls do not offer themselves for selection: a long press on a bank row raised the iOS text
   menu over the row instead of opening it. The figures stay selectable — a rate is the one thing
   here worth copying out. */
button,nav,header,.chip,.pill,.pad button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.n,.amt,.got{-webkit-user-select:text;user-select:text}
body{background:var(--bg);color:var(--text);font:15px/1.45 "Inter",system-ui,-apple-system,sans-serif;
  padding:0 16px calc(84px + env(safe-area-inset-bottom));overflow-x:hidden}
/* Figures in the monospace face throughout: down a column of eight banks the digits line up, which
   turns comparing 9,22 against 9,18 into a glance rather than a reading. */
.n{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.card{background:var(--glass);border-radius:var(--rad);box-shadow:var(--edge);padding:16px}
.soft{background:var(--glass-soft);border-radius:var(--rad);box-shadow:var(--edge)}
h1{font-size:26px;font-weight:600;margin:18px 0 4px}
.sub{color:var(--faint);font-size:13px;margin-bottom:16px}
.lbl{font-size:12.5px;color:var(--faint)}
.row{display:flex;gap:8px}
.row>*{flex:1}
.big{font-size:30px;font-weight:600;margin-top:6px}
.mid{font-size:16px;margin-top:5px}
.pill{height:50px;border-radius:999px;border:0;font:inherit;font-size:15px;display:flex;
  align-items:center;justify-content:center;gap:8px;cursor:pointer;
  color:var(--dim);background:var(--glass-soft);box-shadow:var(--edge)}
.pill.on{color:var(--acc);background:var(--acc-wash);box-shadow:var(--acc-edge)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;height:38px;padding:0 16px;border-radius:999px;border:0;font:inherit;font-size:13.5px;
  color:var(--dim);background:var(--glass-soft);box-shadow:var(--edge);cursor:pointer}
.chip.on{color:var(--acc);background:var(--acc-wash);box-shadow:var(--acc-edge)}
.bank{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:14px 16px;
  background:var(--glass);border-radius:var(--rad);box-shadow:var(--edge);margin-bottom:8px;width:100%;
  border:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.bank .nm{font-size:14.5px}
.bank .v{font-size:15px;text-align:right;min-width:75px}
.best{color:var(--acc)}
input,select{width:100%;height:50px;border-radius:var(--rad);border:0;padding:0 16px;font:inherit;
  color:var(--text);background:var(--glass-soft);box-shadow:var(--edge);outline:none}
input.n{font-size:19px}
nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;
  padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:rgba(11,13,21,.92);
  backdrop-filter:blur(16px);box-shadow:0 -1px 0 rgba(242,244,250,.06)}
nav button{border:0;background:none;font:inherit;font-size:11.5px;color:var(--faint);padding:8px 0 6px;
  display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;min-height:52px}
nav button.on{color:var(--acc)}
nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
.hide{display:none}
.note{font-size:12.5px;color:var(--faint);margin-top:12px}
/* Sits between the best-rate cards and the list, where the question "so what" is asked. */
.gain{display:block;width:100%;text-align:left;border:0;font:inherit;font-size:13px;line-height:1.5;
  color:var(--dim);background:var(--acc-wash);box-shadow:var(--acc-edge);border-radius:16px;
  padding:11px 14px;margin:0 0 10px;cursor:pointer}
.gain b{color:var(--text);font-family:var(--mono);font-weight:600}
.gain span{display:block;margin-top:2px;color:var(--acc)}
.srcbtn{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 16px 0;font:inherit;font-size:12.5px;color:var(--faint)}
.srcmore{color:var(--acc);white-space:nowrap}
.apart{margin-top:18px}
.apart b{display:block;font-size:15px;font-weight:600;color:var(--text)}
.apart span{display:block;margin-top:5px;font-size:13px;line-height:1.5;color:var(--dim)}
.mv{width:7px;height:7px;margin-right:4px;fill:currentColor;display:inline-block;
  vertical-align:middle;position:relative;top:-1px}
/* Muted rather than pure red and green: these sit beside the figure they describe and must not
   outshout it, and a screen of twenty-two rows of saturated colour is unreadable. */
.mv.up{color:#4ade80}
.mv.down{color:#f87171}
.stale{font-size:12.5px;color:#ffd166;background:var(--glass-soft);box-shadow:var(--edge);border-radius:14px;padding:9px 12px;margin-bottom:14px}
/* Amber rather than red: the figure is published and real, it is just the state's average and
   not what the counter quotes. Red would claim it is wrong. */
.nbtbadge{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;font-size:11px;
  color:#ffd166;background:rgba(255,209,102,.12);box-shadow:0 0 0 1px rgba(255,209,102,.3)}
/* A marked bank keeps its place in the list rather than jumping to the top. On a list of eight the
   reorder costs more than it saves: the reader loses the position they had just learned. */
.fav{display:inline-block;width:7px;height:7px;border-radius:2px;background:var(--acc);
  margin-left:7px;vertical-align:middle}
.favbtn{width:34px;height:34px;border-radius:999px;border:0;background:var(--glass-soft);
  box-shadow:var(--edge);color:var(--dim);font-size:15px;cursor:pointer;flex:0 0 auto}
.favbtn.on{color:var(--acc);background:var(--acc-wash);box-shadow:var(--acc-edge)}
/* The amount is typed on a keypad the page owns rather than the system keyboard. On a phone the
   OS keyboard covers half the screen and pushes the result — the number being typed towards — out
   of sight, which is the one thing that must stay visible while typing. */
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.pad button{height:clamp(44px,6.6vh,58px);border-radius:18px;border:0;font:inherit;font-size:22px;color:var(--text);
  background:var(--glass);box-shadow:var(--edge);cursor:pointer}
.pad button:active{background:var(--acc-wash);box-shadow:var(--acc-edge);color:var(--acc)}
.cpill{height:38px;padding:0 14px;border-radius:999px;border:0;font:inherit;font-size:14px;
  color:var(--acc);background:var(--acc-wash);box-shadow:var(--acc-edge);cursor:pointer;flex:0 0 auto}
.amt{font-size:clamp(30px,5.2vh,42px);font-weight:600;letter-spacing:-.02em;line-height:1.1}
.got{font-size:clamp(27px,4.7vh,38px);font-weight:600;letter-spacing:-.02em;color:var(--acc);line-height:1.1}
/* The active tab sits in a capsule, so which screen you are on is legible at a glance rather than
   by comparing two shades of the same colour. */
nav button span.cap{display:flex;align-items:center;justify-content:center;width:56px;height:34px;
  border-radius:999px;transition:background .16s ease, box-shadow .16s ease}
nav button.on span.cap{background:var(--acc-wash);box-shadow:var(--acc-edge)}
/* The sheet answers "what exactly does this bank offer" without leaving the list behind — the page
   stays visible and dimmed underneath, so closing it returns the reader exactly where they were
   rather than to a screen they have to re-orient in. */
.scrim{position:fixed;inset:0;background:rgba(5,6,10,.62);backdrop-filter:blur(2px);z-index:40;
  animation:fade .2s ease both}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:#12141d;
  border-radius:26px 26px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));
  box-shadow:0 -20px 46px rgba(0,0,0,.5), inset 0 1px 0 rgba(242,244,250,.09);
  max-height:88vh;overflow-y:auto;animation:up .26s cubic-bezier(.2,.8,.2,1) both}
.grab{width:36px;height:4px;border-radius:999px;background:rgba(242,244,250,.18);margin:0 auto 14px}
.srow{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:baseline;padding:11px 0;
  box-shadow:inset 0 -1px 0 rgba(242,244,250,.05)}
.srow .v{min-width:62px;text-align:right;font-size:15px}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.link{border:0;background:none;font:inherit;font-size:13.5px;color:var(--acc);cursor:pointer;padding:0}
.brow{display:flex;gap:12px;align-items:center;width:100%;padding:11px 16px;border:0;background:none;
  font:inherit;font-size:15px;color:inherit;text-align:left;cursor:pointer}
/* The mock keeps one soft accent glow behind the top-left corner — the single piece of colour on
   the ground, sized and blurred so it reads as depth rather than as decoration. */
.blob{position:fixed;width:360px;height:360px;left:-120px;top:-110px;border-radius:50%;
  background:radial-gradient(circle, rgba(110,231,255,.22), transparent 70%);filter:blur(80px);
  pointer-events:none;z-index:-1}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#app{animation:rise .3s ease backwards}
/* 56px, title and controls on one line — not a page heading stacked above the content. */
header{height:56px;display:flex;align-items:center;gap:8px;padding:0 20px;position:sticky;top:0;
  /* Frosted rather than solid, the same treatment the tab bar already uses at the other end of the
     screen. The blur is what makes it work: at 20px whatever scrolls underneath dissolves into
     colour, so the title stays readable over a column of moving figures instead of colliding with
     them the way plain transparency would. */
  background:rgba(11,13,21,.7);backdrop-filter:blur(20px) saturate(140%);
  -webkit-backdrop-filter:blur(20px) saturate(140%);
  z-index:10;margin:0 -16px;box-shadow:0 1px 0 rgba(242,244,250,.07)}
header .ttl{flex:1;min-width:0;font-size:20px;font-weight:600;letter-spacing:-.03em}
/* Telegram names the app above this, so the bar is shorter here — but it still says which screen
   you are on, which is the one thing Telegram's own bar does not. */
body.tg header{height:48px}
body.tg header .ttl{font-size:18px}
header button{height:34px;padding:0 14px;border-radius:999px;border:0;font:inherit;font-size:13px;
  color:#c8cddb;background:var(--glass-soft);box-shadow:var(--edge);cursor:pointer}
/* Currencies are one segmented control, not loose chips: the three are a single choice. */
.seg{display:flex;gap:6px;padding:3px;border-radius:999px;background:var(--glass-soft);
  box-shadow:var(--edge);margin-bottom:14px}
.seg button{flex:1;height:38px;border-radius:999px;border:0;font:inherit;font-size:13.5px;
  color:var(--dim);background:none;cursor:pointer}
.seg button.on{color:var(--acc);background:var(--acc-wash);box-shadow:var(--acc-edge)}
</style>

// The choice outlives the session: someone who reads Tajik reads Tajik every time, and asking them
// to pick again on each visit is asking them to notice the site is in the wrong language first.
let T = D[localStorage.getItem('bankrate-m-lang') || 'ru'] || D.ru;

const CUR = ['USD','RUB','EUR'];
const CUR_NAME = {USD:'Доллар США', RUB:'Российский рубль', EUR:'Евро'};
// Somoni for reading, not for arithmetic: thousands spaced and the comma this country writes.
// One copy, because there were two and one of them quietly stopped inserting the spaces.
const money = (n, decimals = 2) => n.toFixed(decimals).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, ' ');

const fmt = (v,c) => v == null ? '—' : v.toFixed(c === 'RUB' ? 4 : 2).replace('.', ',');
const el = h => { const d = document.createElement('div'); d.innerHTML = h; return d; };

const S = { online: navigator.onLine, about:false, sort:'name', typed:{}, sheetType:null, ownOnly:false, favs: JSON.parse(localStorage.getItem('bankrate-m-favs') || '[]'), lang: localStorage.getItem('bankrate-m-lang') || 'ru', sheet:null, compareMode:false, compare:[], tab:'home', cur:'USD', q:'', amount:'1000', amountFresh:true, from:'USD', dir:'buy', bank:null, rates:[], limits:[] };

async function load(){
  const [r,l,ty] = await Promise.all([
    fetch('/data/rates.json').then(x=>x.json()),
    fetch('/data/limits.json').then(x=>x.json()).catch(()=>({data:[]})),
    // Optional on purpose: four banks publish more than one rate and the rest publish one. A
    // failure here costs the switcher and nothing else, so it must not take the screen with it.
    fetch('/data/rates-typed.json').then(x=>x.json()).catch(()=>({data:{}}))
  ]);
  S.rates = r.data || [];
  S.limits = l.data || [];
  S.typed = ty.data || {};
  S.bank = S.rates[0]?.bankId ?? null;
  render();
}

function ago(iso){
  const mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if(mins < 1) return T.justNow;
  if(mins < 60) return mins + ' ' + T.minAgo;
  const h = Math.round(mins / 60);
  return h < 24 ? h + ' ' + T.hAgo : Math.round(h / 24) + ' ' + T.dAgo;
}

// Caching the app makes it open without a connection; this makes it say so. A rate is a number with
// a time attached, and a cached screen that looks live is a worse failure than a screen that does
// not open — the reader would walk to a bank on a figure that moved hours ago. Silent under four
// hours, because updates run every three and one late cycle is not news.
function bannerHtml(){
  const newest = S.rates.reduce((a,r) => Math.max(a, new Date(r.updatedAt).getTime()), 0);
  if(!newest) return '';
  const stale = Date.now() - newest > 4 * 3600 * 1000;
  if(S.online && !stale) return '';
  return `<div class="stale">${S.online ? T.updatedAgo : T.offline} · ${ago(new Date(newest).toISOString())}</div>`;
}

// Which way a figure last moved, from recorded history. Absent unless the server could support it:
// it withholds the direction when the two readings are of different rate types, when the newest is
// older than two days, and when there is only one reading — so anything here is a real movement.
//
// Deliberately one colour for both directions. A rate rising is good for whoever is selling that
// currency and bad for whoever is buying it, so painting up green and down red would be wrong for
// half the people reading it. Flat draws nothing: most figures are unchanged most of the time, and
// a marker on each of them is noise that hides the few that moved.
// Telegram integration.
//
// Loaded only inside Telegram, decided from the launch parameters Telegram puts in the URL. The
// alternative — a script tag in the head — would put a third-party request on every load of a page
// whose whole point is that it opens without a connection, to run code that does nothing outside
// Telegram. Everything below is feature-detected, so an old client or a failed load costs the
// integration and never the app.
function inTelegram(){
  return location.hash.indexOf('tgWebApp') !== -1 || !!window.TelegramWebviewProxy;
}

const TG = () => (window.Telegram || {}).WebApp;

function haptic(style){
  const tg = TG();
  try { tg.HapticFeedback.impactOccurred(style || 'light'); } catch(e){}
}

// Telegram's own back button. Without this the reader's instinct — press back to close the bank —
// closes the entire mini app instead, which is the difference between a page inside Telegram and
// something that behaves like it belongs there.
function syncTelegram(){
  const tg = TG();
  if(!tg || !tg.BackButton) return;
  try { (S.sheet != null || S.about) ? tg.BackButton.show() : tg.BackButton.hide(); } catch(e){}
}

function initTelegram(){
  const tg = TG();
  if(!tg) return;
  document.body.classList.add('tg');
  try { tg.ready(); tg.expand(); } catch(e){}

  // The palette here is a deliberate dark one, chosen so eight bank cards read as a single surface.
  // Repainting it to follow a light Telegram theme would undo that; matching Telegram's own chrome
  // to the app is the way round that keeps the design intact.
  try { tg.setHeaderColor('#0b0d15'); tg.setBackgroundColor('#0b0d15'); } catch(e){}
  // Telegram paints its bottom bar white by default, which reads as a broken strip under a dark app.
  try { tg.setBottomBarColor('#0b0d15'); } catch(e){}
  // Newer clients only: without it a scroll that starts at the top drags the app closed.
  try { tg.disableVerticalSwipes(); } catch(e){}
  try { tg.BackButton.onClick(() => { S.sheet = null; S.about = false; render(); }); } catch(e){}

  // A reader who has never touched the language button gets the language of their Telegram account
  // rather than Russian. An explicit choice always wins — it is stored, and this never overrides it.
  if(!localStorage.getItem('bankrate-m-lang')){
    const code = ((tg.initDataUnsafe || {}).user || {}).language_code || '';
    const pick = code.slice(0,2) === 'tg' ? 'tj' : code.slice(0,2) === 'uz' ? 'uz' : '';
    if(pick){ S.lang = pick; T = D[pick]; }
  }
  render();
}

if(inTelegram()){
  const s = document.createElement('script');
  s.src = 'https://telegram.org/js/telegram-web-app.js';
  s.onload = initTelegram;
  document.head.appendChild(s);
}

// Rates travel by forwarded message here, so this is the shape they travel in. Inside Telegram it
// opens Telegram's own share sheet — the reader picks the chat and presses send, we never do.
function shareRate(id){
  const r = S.rates.find(x => x.bankId === id);
  if(!r) return;
  const line = c => c + ' ' + fmt(val(r,c,'buy'),c) + ' / ' + fmt(val(r,c,'sell'),c);
  const at = new Date(r.updatedAt);
  const two = n => String(n).padStart(2, '0');
  const stamp = two(at.getDate()) + '.' + two(at.getMonth() + 1) + ', ' + two(at.getHours()) + ':' + two(at.getMinutes());
  const text = T.navHome + ' · ' + bankName(r.bank) + ' · ' + stamp + '\n' + CUR.map(line).join('\n');
  const url = 'https://shohruh-pixel.github.io/m/';
  const tg = TG();
  if(tg && tg.openTelegramLink){
    haptic();
    try {
      tg.openTelegramLink('https://t.me/share/url?url=' + encodeURIComponent(url) + '&text=' + encodeURIComponent(text));
      return;
    } catch(e){}
  }
  if(navigator.share){ navigator.share({ text: text + '\n' + url }).catch(()=>{}); return; }
  navigator.clipboard && navigator.clipboard.writeText(text + '\n' + url).catch(()=>{});
}

function arrow(r, field, tracked){
  const d = tracked !== false && r.trend && r.trend.changes && r.trend.changes[field] && r.trend.changes[field].direction;
  // Same box, nothing drawn in it: unchanged figures — most of them, most of the time — keep the
  // column straight without adding a marker that would drown the few that moved.
  if(d !== 'up' && d !== 'down') return '<span class="mv" aria-hidden="true"></span>';
  const shape = d === 'up' ? 'M5 0 10 9H0z' : 'M5 9 0 0h10z';
  return `<svg class="mv ${d}" viewBox="0 0 10 9" aria-hidden="true"><path d="${shape}"/></svg>`;
}

// Intl collation, not code-point order: Cyrillic Ё, Uzbek O' and the rest sit where a reader
// expects them only if the comparison knows which alphabet it is in.
const LOCALE = { ru: 'ru', tj: 'tg', uz: 'uz' };
const byName = () => {
  const l = LOCALE[S.lang] || 'ru';
  return (a, b) => bankName(a.bank).localeCompare(bankName(b.bank), l);
};

const ABROAD = {
  ru: {'Not supported':'Не поддерживается','Not available':'Недоступно','bank + ATM fee':'банк + комиссия банкомата','plus ATM fee':'плюс комиссия банкомата','plus operator fee':'плюс комиссия оператора'},
  tj: {'Not supported':'Дастгирӣ намешавад','Not available':'Дастрас нест','bank + ATM fee':'бонк + комиссияи банкомат','plus ATM fee':'плюс комиссияи банкомат','plus operator fee':'плюс комиссияи оператор'},
  uz: {'Not supported':"Qo'llab-quvvatlanmaydi",'Not available':'Mavjud emas','bank + ATM fee':'bank + bankomat komissiyasi','plus ATM fee':'plyus bankomat komissiyasi','plus operator fee':'plyus operator komissiyasi'}
};

function abroad(value){
  let s = value || '';
  const phrases = ABROAD[S.lang] || ABROAD.ru;
  for(const [en, tr] of Object.entries(phrases)) s = s.split(en).join(tr);
  return s;
}

// Named from the reader's side, which is the opposite of the column headings: someone selling
// dollars is quoted the bank's buy rate, and wants the highest. Sorting by the heading instead
// would put the worst bank first for the commonest thing anyone does here.
//
// Alphabetical stays the default. Twenty-two banks reordering themselves the moment a rate moves
// costs a reader the position they had just learned, and most people arrive looking for their own
// bank rather than for the best one.
function order(){
  if(S.sort === 'sell') return (a,b) => (val(b,S.cur,'buy') || 0) - (val(a,S.cur,'buy') || 0);
  if(S.sort === 'buy') return (a,b) => (val(a,S.cur,'sell') || Infinity) - (val(b,S.cur,'sell') || Infinity);
  return byName();
}

// The point of the whole thing, said in money. A column of 9,22 against 9,16 is a comparison the
// reader has to perform; on a thousand dollars those six hundredths are sixty somoni, and that is
// the sentence they came for. Uses the converter's amount, so the two screens agree about what is
// being changed.
function gainLine(){
  const amt = parseFloat(String(S.amount || '0').replace(',','.')) || 0;
  const buys = S.rates.map(r => val(r, S.cur, 'buy')).filter(v => v > 0);
  if(!amt || buys.length < 2) return '';

  const low = Math.min(...buys) * amt;
  const high = Math.max(...buys) * amt;
  const diff = high - low;
  if(diff < 0.005) return '';

  return `<button class="gain" data-tab="conv">
    ${T.gainFor} ${fmtAmount(amt)} ${S.cur} ${T.gainGet} <b>${money(low, 0)}</b> ${T.gainTo} <b>${money(high, 0)}</b> ${T.somoni}
    <span>${T.gainDiff} ${money(diff, diff < 10 ? 2 : 0)}</span>
  </button>`;
}

// The typed amount as the reader left it, not reformatted: 1000 stays 1000 and 0.5 stays 0,5.
function fmtAmount(n){
  return String(n).replace('.', ',');
}

function updatedLine(){
  const newest = S.rates.reduce((max, r) => Math.max(max, new Date(r.updatedAt).getTime()), 0);
  if(!newest) return '';
  return `<div class="lbl" style="padding:0 16px 10px">${T.updatedAll} ${ago(new Date(newest).toISOString())}</div>`;
}

function sortChips(){
  return `<div class="chips" style="padding:0 16px 10px">${
    [['name',T.sortName],['sell',T.sortSell],['buy',T.sortBuy]]
      .map(([k,l]) => `<button class="chip ${S.sort===k?'on':''}" data-sort="${k}">${l}</button>`).join('')
  }</div>`;
}

const bankName = b => (S.lang === 'tj' && b.nameTj) || (S.lang === 'uz' && b.nameUz) || b.nameRu;

const val = (r,c,side) => r[c.toLowerCase() + (side === 'buy' ? 'Buy' : 'Sell')];

// Best to sell = the bank paying most for your currency. Best to buy = the bank charging least.
// Named from the reader's side, because "лучший курс покупки" describes what the bank does and
// sends people to the wrong side of the spread.
function best(c){
  const list = S.rates.filter(r => val(r,c,'buy') != null);
  if(!list.length) return null;
  return {
    sell: list.reduce((a,b)=> val(b,c,'buy') > val(a,c,'buy') ? b : a),
    buy:  list.reduce((a,b)=> val(b,c,'sell') < val(a,c,'sell') ? b : a)
  };
}

function screenHome(){
  const b = best(S.cur);
  if(!b) return `<div class="card">${T.noData}</div>`;
  return `
  <div class="seg">
    ${CUR.map(c=>`<button class="${c===S.cur?'on':''}" data-cur="${c}">${c}</button>`).join('')}
  </div>
  <div class="row" style="margin-bottom:8px">
    <div class="card">
      <div class="lbl">${T.bestBuy}</div>
      <div class="big n best">${fmt(val(b.sell,S.cur,'buy'),S.cur)}</div>
      <div class="lbl" style="margin-top:6px">${bankName(b.sell.bank)}</div>
    </div>
    <div class="card">
      <div class="lbl">${T.bestSell}</div>
      <div class="big n">${fmt(val(b.buy,S.cur,'sell'),S.cur)}</div>
      <div class="lbl" style="margin-top:6px">${bankName(b.buy.bank)}</div>
    </div>
  </div>
  ${gainLine()}
  <div class="card" style="margin-top:8px;padding:16px 0">
    <div style="display:flex;align-items:baseline;justify-content:space-between;padding:0 16px 12px">
      <div style="font-size:17px;font-weight:600">${T.allBanks}</div>
      <button data-tab="rates" class="link">${T.more} →</button>
    </div>
    ${updatedLine()}
    ${sortChips()}
    <div class="row lbl" style="padding:0 16px 8px">
      <div>${T.bank}</div>
      <div style="text-align:right;flex:0 0 62px">${T.buy}</div>
      <div style="text-align:right;flex:0 0 62px">${T.sell}</div>
    </div>
    ${[...S.rates].sort(order()).map(r=>`
      <button class="brow" data-bank="${r.bankId}">
        <div style="flex:1;min-width:0;font-size:14.5px">${bankName(r.bank)}${S.favs.includes(r.bankId)?'<span class="fav"></span>':''}</div>
        <div class="n ${r.bankId===b.sell.bankId?'best':''}" style="flex:0 0 73px;text-align:right">${arrow(r, S.cur.toLowerCase()+'Buy')}${fmt(val(r,S.cur,'buy'),S.cur)}</div>
        <div class="n ${r.bankId===b.buy.bankId?'best':''}" style="flex:0 0 73px;text-align:right">${arrow(r, S.cur.toLowerCase()+'Sell')}${fmt(val(r,S.cur,'sell'),S.cur)}</div>
      </button>`).join('')}
    <button class="srcbtn" data-about="1">${T.source} <span class="srcmore">${T.aboutTitle} →</span></button>
  </div>`;
}

// Two banks side by side, every currency at once. Choosing between banks is the actual decision
// this product exists to support, and scrolling a list comparing one column at a time is how people
// lose track of which was better — the answer changes depending on the currency they hold.
function comparePanel(){
  const picked = S.compare.map(id => S.rates.find(r => r.bankId === id)).filter(Boolean);
  if(picked.length < 2) return `<div class="note" style="margin:0 0 12px">${T.pickTwo}</div>`;

  const [a, c] = picked;
  return `
  <div class="card" style="margin-bottom:12px">
    <div class="row lbl" style="margin-bottom:10px">
      <div style="flex:0 0 44px"></div>
      <div style="text-align:right">${bankName(a.bank)}</div>
      <div style="text-align:right">${bankName(c.bank)}</div>
    </div>
    ${CUR.map(cur => ['buy','sell'].map(side => {
      const va = val(a,cur,side), vc = val(c,cur,side);
      // Better for the reader: selling into the higher bid, buying at the lower ask.
      const aWins = side === 'buy' ? va > vc : va < vc;
      return `<div class="row" style="margin-bottom:6px;align-items:baseline">
        <div class="lbl" style="flex:0 0 44px">${cur} ${side === 'buy' ? '↓' : '↑'}</div>
        <div class="n ${va !== vc && aWins ? 'best' : ''}" style="text-align:right">${fmt(va,cur)}</div>
        <div class="n ${va !== vc && !aWins ? 'best' : ''}" style="text-align:right">${fmt(vc,cur)}</div>
      </div>`;
    }).join('')).join('')}
    <div class="lbl" style="margin-top:10px">↓ ${T.buy} · ↑ ${T.sell}</div>
  </div>`;
}

function screenRates(){
  const q = S.q.toLowerCase();
  const list = S.rates
    .filter(r => !q || [r.bank.nameRu, r.bank.nameTj, r.bank.nameUz].some(n => (n || '').toLowerCase().includes(q)))
    .filter(r => !S.ownOnly || !r.sourceLabel.startsWith('НБТ'))
    .sort(order());
  const b = best(S.cur);
  return `
  <div class="sub">${list.length} / ${S.rates.length}</div>
  <input id="q" placeholder="${T.search}" value="${S.q}" style="margin-bottom:10px">
  <div class="row" style="margin-bottom:10px">
  <button class="pill ${S.ownOnly?'on':''}" data-own="1">${T.ownOnly}</button>
  <button class="pill ${S.compareMode?'on':''}" data-cmp="toggle">
    ${S.compareMode ? T.clear : T.compare}
  </button>
  </div>
  ${S.compareMode ? comparePanel() : ''}
  <div class="seg">
    ${CUR.map(c=>`<button class="${c===S.cur?'on':''}" data-cur="${c}">${c}</button>`).join('')}
  </div>
  ${updatedLine()}
  ${sortChips()}
  <div class="row lbl" style="padding:0 16px 6px"><div></div>
    <div style="text-align:right;flex:0 0 64px">${T.buy}</div>
    <div style="text-align:right;flex:0 0 64px">${T.sell}</div></div>
  ${list.length ? '' : `
    <div class="card" style="text-align:center;padding:26px 18px">
      <div style="font-size:15px;font-weight:600">${T.notFound}</div>
      <div class="lbl" style="margin-top:6px;line-height:1.5">${T.notFoundHint}</div>
      <button class="pill" style="margin:14px auto 0;padding:0 24px" data-clearq="1">${T.showAll}</button>
    </div>`}
  ${list.map(r=>`
    <button class="bank" data-bank="${r.bankId}" style="${S.compareMode && S.compare.includes(r.bankId) ? 'box-shadow:var(--acc-edge)' : ''}">
      <div><div class="nm">${bankName(r.bank)}${S.favs.includes(r.bankId)?'<span class="fav"></span>':''}</div><div class="lbl">${r.sourceLabel}${r.sourceLabel.startsWith('НБТ')?`<span class="nbtbadge">${T.official}</span>`:''}</div></div>
      <div class="v n ${b && r.bankId===b.sell.bankId?'best':''}">${arrow(r, S.cur.toLowerCase()+'Buy')}${fmt(val(r,S.cur,'buy'),S.cur)}</div>
      <div class="v n ${b && r.bankId===b.buy.bankId?'best':''}">${arrow(r, S.cur.toLowerCase()+'Sell')}${fmt(val(r,S.cur,'sell'),S.cur)}</div>
    </button>`).join('')}`;
}

function screenConv(){
  if(!S.rates.length) return `<div class="card">${T.noData}</div>`;
  return (() => {
    const r = S.rates.find(x=>x.bankId===S.bank) || S.rates[0];
    const other = S.from === 'TJS' ? S.cur : S.from;
    const rate = val(r, other, S.dir);
    const amt = parseFloat(String(S.amount || '0').replace(',','.')) || 0;
    const out = S.from === 'TJS' ? (rate ? amt / rate : 0) : amt * rate;
    const grp = n => money(n);
    return `
    <div class="card">
      <div style="display:flex;align-items:center;gap:10px">
        <div class="amt n" style="flex:1;min-width:0;overflow:hidden${S.amountFresh ? ';color:var(--faint)' : ''}">${S.amount || '0'}</div>
        <button class="cpill" data-swapcur="1">${S.from} ⇅</button>
      </div>
      <div style="display:flex;justify-content:flex-end;margin-top:10px">
        <button class="chip" data-dir="1">⇵ ${S.dir === 'buy' ? T.buy : T.sell}</button>
      </div>
      <div style="height:1px;background:rgba(242,244,250,.06);margin:14px 0"></div>
      <div style="display:flex;align-items:center;gap:10px">
        <div style="flex:1;min-width:0">
          <div class="lbl" style="color:var(--acc)">${T.iGet}</div>
          <div class="got n">${grp(out)}</div>
        </div>
        <div class="chip" style="pointer-events:none">${S.from === 'TJS' ? other : 'TJS'}</div>
      </div>
    </div>

    <div class="lbl" style="margin:14px 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:10px">
      <span>${T.pickBank}</span><span class="n" style="font-size:15px;color:var(--text)">${fmt(rate, other)}</span>
    </div>
    <div class="chips">
      <!-- Full names: the strip scrolls, and cutting to the first word made ten of these read
           "Бонки" in Tajik, where almost every bank name starts with it. -->
      ${[...S.rates].sort(byName()).map(x=>`<button class="chip ${x.bankId===S.bank?'on':''}" data-bank2="${x.bankId}">${bankName(x.bank)}</button>`).join('')}
    </div>

    <div class="pad">
      ${['1','2','3','4','5','6','7','8','9','.','0','⌫'].map(k=>`<button data-key="${k}">${k}</button>`).join('')}
    </div>`;
  })();
}

function screenLimits(){
  // "Нет данных" was true and useless. Twelve invented figures used to fill this screen — daily
  // allowances and ATM commissions no bank ever published — and after removing them the reader
  // deserves the reason rather than a shrug: no bank in this country publishes its withdrawal limits
  // anywhere that can be read, so the honest place to ask is the bank.
  if(!S.limits.length) return `
    <div class="card" style="text-align:center;padding:28px 18px;margin-top:8px">
      <div style="font-size:15px;font-weight:600">${T.limitsEmpty}</div>
      <div class="lbl" style="margin-top:8px;line-height:1.55;text-align:left">${T.limitsWhy}</div>
    </div>`;

  // Grouped by bank, because the question is "what does my bank allow", not "list every card in
  // the country" — and a bank with two cards should read as one entry with two, not as two banks.
  const byBank = {};
  S.limits.forEach(l => { (byBank[l.bank.slug] = byBank[l.bank.slug] || []).push(l); });

  return `
  <div class="sub" style="margin-top:2px">${S.limits.length} ${T.cards}</div>
  ${Object.values(byBank).map(cards => `
    <div class="card" style="margin-bottom:10px">
      <div style="font-size:17px;font-weight:600;margin-bottom:2px">${bankName(cards[0].bank)}</div>
      ${cards.map(l => `
        <div style="margin-top:14px">
          <div class="lbl">${l.cardType} · ${l.cardName}</div>
          ${(() => {
            // Only what the bank published. Banks describe their limits in whatever period they
            // choose — Humo's cash limit is weekly — so a figure is shown under the label it was
            // given and the rest of the boxes simply are not drawn.
            const boxes = [
              [T.perDay, l.dailyLimit], [T.perMonth, l.monthlyLimit],
              [T.perWeek, l.weeklyLimit], [T.atCounter, l.counterLimit],
              [T.ownAtm, l.ownAtmNote], [T.otherAtm, l.otherAtmNote]
            ].filter(([, value]) => value);
            const rows = [];
            for(let i = 0; i < boxes.length; i += 2) rows.push(boxes.slice(i, i + 2));
            return rows.map(row => `<div class="row" style="margin-top:8px">${row.map(([label, value]) =>
              `<div class="soft" style="padding:13px 16px"><div class="lbl">${label}</div><div class="mid n">${value}</div></div>`
            ).join('')}</div>`).join('');
          })()}
          ${l.abroadNote ? `<div class="soft" style="padding:13px 16px;margin-top:8px"><div class="lbl">${T.abroad}</div><div class="mid">${abroad(l.abroadNote)}</div></div>` : ''}
          ${l.noteRu ? `<div class="lbl" style="margin-top:10px">${S.lang==='tj'?(l.noteTj||l.noteRu):S.lang==='uz'?(l.noteUz||l.noteRu):l.noteRu}</div>` : ''}
        </div>`).join('')}
    </div>`).join('')}
  <div class="note">${T.limitsCoverage.replace('{n}', S.limits.length).replace('{all}', S.rates.length || 22)}</div>
  <div class="note" style="margin-top:6px">${T.limitsNote}</div>`;
}

const ICON = {
  home:'<path d="M3.5 10.5 12 4l8.5 6.5V19a1.5 1.5 0 0 1-1.5 1.5h-4.5V15h-5v5.5H5A1.5 1.5 0 0 1 3.5 19z"/>',
  rates:'<path d="M4 20V11M9.3 20V6M14.7 20v-6M20 20V9"/>',
  conv:'<path d="M4 8.5h14M14.5 5 18 8.5 14.5 12M20 15.5H6M9.5 12 6 15.5 9.5 19"/>',
  limits:'<rect x="2.5" y="5.5" width="19" height="13" rx="2.5"/><path d="M2.5 10h19M6 15h3"/>'
};


// Who is behind the numbers, in a product about money. The phone app had no way to ask: the desktop
// site has an about page, and nobody arriving through Telegram will ever see it.
function aboutHtml(){
  const part = (t,b) => `<div class="apart"><b>${t}</b><span>${b}</span></div>`;
  return `
  <div class="scrim" data-close="1"></div>
  <div class="sheet">
    <div class="grab"></div>
    <div style="font-size:20px;font-weight:600;letter-spacing:-.02em">${T.aboutTitle}</div>
    ${part(T.aboutWhatT, T.aboutWhatB)}
    ${part(T.aboutSrcT, T.aboutSrcB)}
    ${part(T.aboutRiskT, T.aboutRiskB)}
    ${part(T.aboutDataT, T.aboutDataB)}
    ${part(T.aboutContactT, T.aboutContactB)}
  </div>`;
}

// Rendered outside the screen switch so it floats over whichever tab is open.
function sheetHtml(){
  const r = S.rates.find(x => x.bankId === S.sheet);
  if(!r) return '';

  const lim = S.limits.find(l => l.bank.slug === r.bank.slug);

  return `
  <div class="scrim" data-close="1"></div>
  <div class="sheet">
    <div class="grab"></div>
    <div style="display:flex;align-items:center;gap:10px"><div style="flex:1;min-width:0;font-size:20px;font-weight:600;letter-spacing:-.02em">${bankName(r.bank)}</div><button class="favbtn" data-share="${r.bankId}" aria-label="${T.share}">↗</button><button class="favbtn ${S.favs.includes(r.bankId)?'on':''}" data-fav="${r.bankId}" aria-label="${S.favs.includes(r.bankId)?T.unfav:T.fav}">${S.favs.includes(r.bankId)?'★':'☆'}</button></div>
    <div class="lbl" style="margin:4px 0 14px">${T.updated} ${ago(r.updatedAt)}</div>
    ${r.sourceLabel.startsWith('НБТ') ? `<div class="lbl" style="color:#ffd166;margin:-8px 0 14px">${T.officialNote}</div>` : ''}

    ${(() => {
      const byCur = S.typed[r.bank.slug] || {};
      const found = new Set();
      Object.values(byCur).forEach(perType => Object.keys(perType).forEach(t => found.add(t)));
      const avail = T.typeOrder.filter(t => found.has(t));
      if (avail.length < 2) return '';
      const active = avail.includes(S.sheetType) ? S.sheetType : avail[0];
      return `<div class="chips" style="margin-bottom:12px">${avail.map(t =>
        `<button class="chip ${t===active?'on':''}" data-stype="${t}">${T.types[t]}</button>`).join('')}</div>`;
    })()}
    <div class="row lbl" style="padding-bottom:6px">
      <div>${T.currency}</div>
      <div class="v" style="flex:0 0 62px;text-align:right">${T.buy}</div>
      <div class="v" style="flex:0 0 62px;text-align:right">${T.sell}</div>
    </div>
    ${CUR.map(c => {
      const byCur = S.typed[r.bank.slug] || {};
      const found = new Set();
      Object.values(byCur).forEach(perType => Object.keys(perType).forEach(t => found.add(t)));
      const avail = T.typeOrder.filter(t => found.has(t));
      const active = avail.includes(S.sheetType) ? S.sheetType : avail[0];
      // Falls back to the headline figures when the bank publishes only one rate, so a card never
      // empties just because there is nothing to switch between.
      const picked = avail.length > 1 ? (byCur[c] || {})[active] : null;
      const buy = picked ? picked.buy : val(r,c,'buy');
      const sell = picked ? picked.sell : val(r,c,'sell');
      const tracked = !picked || active === r.rateType;
      return `
      <div class="srow">
        <div style="font-size:15.5px">${c}<span class="lbl"> · ${CUR_NAME[c]}</span></div>
        <div class="v n">${arrow(r, c.toLowerCase() + 'Buy', tracked)}${fmt(buy,c)}</div>
        <div class="v n">${sell === null ? '—' : arrow(r, c.toLowerCase() + 'Sell', tracked) + fmt(sell,c)}</div>
      </div>`;
    }).join('')}

    ${lim ? `<div class="row" style="margin-top:14px">
      <div class="soft" style="padding:13px 16px"><div class="lbl">${T.perDay}</div><div class="mid n">${lim.dailyLimit}</div></div>
      <div class="soft" style="padding:13px 16px"><div class="lbl">${T.fee}</div><div class="mid n">${lim.commission}</div></div>
    </div>` : ''}

    <div class="row" style="margin-top:16px">
      <button class="pill on" data-use="${r.bankId}">${T.convertHere}</button>
      <button class="pill" style="flex:0 0 auto;padding:0 22px" data-close="1">${T.close}</button>
    </div>
  </div>`;
}

// Kept in step with screenConv, which computes the same two values when it draws the screen whole.
function repaintAmount(){
  const amtEl = document.querySelector('.amt');
  const gotEl = document.querySelector('.got');
  if(!amtEl || !gotEl || !S.rates.length) return false;

  const r = S.rates.find(x => x.bankId === S.bank) || S.rates[0];
  const other = S.from === 'TJS' ? S.cur : S.from;
  const rate = val(r, other, S.dir);
  const amt = parseFloat(String(S.amount || '0').replace(',','.')) || 0;
  const out = S.from === 'TJS' ? (rate ? amt / rate : 0) : amt * rate;

  amtEl.textContent = S.amount || '0';
  amtEl.style.color = S.amountFresh ? 'var(--faint)' : '';
  gotEl.textContent = out.toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return true;
}

function render(){
  document.querySelectorAll('.scrim,.sheet').forEach(n => n.remove());
  document.getElementById('app').innerHTML = bannerHtml() +
    (S.tab==='home'?screenHome():S.tab==='rates'?screenRates():S.tab==='conv'?screenConv():screenLimits());
  document.getElementById('nav').innerHTML = [
    ['home',T.navHome],['rates',T.navRates],['conv',T.navConv],['limits',T.navLimits]
  ].map(([k,l])=>`<button class="${S.tab===k?'on':''}" data-tab="${k}">
      <span class="cap"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg></span>${l}</button>`).join('');
  if(S.sheet != null) document.body.insertAdjacentHTML('beforeend', sheetHtml());
  else if(S.about) document.body.insertAdjacentHTML('beforeend', aboutHtml());
  document.body.style.overflow = (S.sheet != null || S.about) ? 'hidden' : '';
  document.getElementById('lang').textContent = S.lang.toUpperCase();
  document.getElementById('ttl').textContent = S.tab==='home'?T.titleHome:S.tab==='rates'?T.titleRates:S.tab==='conv'?T.titleConv:T.titleLimits;
  document.title = (S.tab==='home'?T.titleHome:S.tab==='rates'?T.titleRates:S.tab==='conv'?T.titleConv:T.titleLimits) + ' — BankRate TJ';
  syncTelegram();
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-cur],[data-bank],[data-from],[data-cmp],[data-close],[data-use],[data-key],[data-bank2],[data-dir],[data-swapcur],[data-fav],[data-own],[data-stype],[data-share],[data-about],[data-clearq],[data-sort]');
  if(!t) return;
  const tabBefore = S.tab;
  if(t.dataset.sort){ S.sort = t.dataset.sort; }
  else if(t.dataset.clearq){ S.q = ''; S.ownOnly = false; }
  else if(t.dataset.about){ S.about = true; }
  else if(t.dataset.share){ shareRate(Number(t.dataset.share)); return; }
  if(t.dataset.stype){ S.sheetType = t.dataset.stype; }
  else if(t.dataset.own){ S.ownOnly = !S.ownOnly; }
  else if(t.dataset.fav){
    const id = Number(t.dataset.fav);
    S.favs = S.favs.includes(id) ? S.favs.filter(x=>x!==id) : [...S.favs, id];
    localStorage.setItem('bankrate-m-favs', JSON.stringify(S.favs));
  }
  else if(t.dataset.key){
    const k = t.dataset.key;
    // Typing is capped and the separator kept single, because the field has no browser validation
    // behind it — the page owns the keypad, so the page owns what a valid amount is.
    if(k === '⌫'){ S.amount = String(S.amount).slice(0, -1) || ''; S.amountFresh = false; }
    else if(k === '.'){
      if(S.amountFresh){ S.amount = '0.'; S.amountFresh = false; }
      else if(!String(S.amount).includes('.')) S.amount = (S.amount || '0') + '.';
    }
    else if(S.amountFresh){ S.amount = k; S.amountFresh = false; }
    else if(String(S.amount).replace(/\D/g,'').length < 9) S.amount = (S.amount === '0' ? '' : S.amount) + k;
    if(repaintAmount()) return;
  }
  else if(t.dataset.bank2) S.bank = Number(t.dataset.bank2);
  else if(t.dataset.dir) S.dir = S.dir === 'buy' ? 'sell' : 'buy';
  else if(t.dataset.swapcur){ const i = ['TJS',...CUR].indexOf(S.from); S.from = ['TJS',...CUR][(i+1) % 4]; }
  else if(t.dataset.close){ S.sheet = null; S.about = false; }
  else if(t.dataset.use){ S.bank = Number(t.dataset.use); S.sheet = null; S.tab = 'conv'; }
  else if(t.dataset.tab) S.tab = t.dataset.tab;
  else if(t.dataset.cur) S.cur = t.dataset.cur;
  else if(t.dataset.from) S.from = t.dataset.from;
  else if(t.dataset.cmp){ S.compareMode = !S.compareMode; S.compare = []; }
  else if(t.dataset.bank){
    const id = Number(t.dataset.bank);
    if(S.compareMode){
      // Two at a time: a third pick replaces the older of the pair, so the control never dead-ends
      // on a full selection the reader has to clear by hand.
      S.compare = S.compare.includes(id) ? S.compare.filter(x=>x!==id)
        : [...S.compare, id].slice(-2);
    } else { S.sheet = id; S.sheetType = null; haptic(); }
  }
  render();
  // Only when the screen actually changed. This used to fire on every click that did not leave a
  // sheet open, which threw the reader back to the top of a list of twenty-two whenever they closed
  // a bank card, starred a bank or switched currency — and it is what defeated three attempts to
  // restore the scroll position from inside render(), each of which ran and was then undone one
  // line later. Moving to another tab is a different screen and does start at the top.
  if(S.tab !== tabBefore) window.scrollTo(0,0);
});

// Typing must not re-render the field it is typed into, or the caret jumps to the start on every
// keystroke — so the input keeps focus and only the parts that depend on it are recomputed.
document.addEventListener('input', e => {
  if(e.target.id === 'q'){ S.q = e.target.value; const v = e.target.value;
    render(); const f = document.getElementById('q'); if(f){ f.value = v; f.focus(); } }
  if(e.target.id === 'amt'){ S.amount = e.target.value; const v = e.target.value;
    render(); const f = document.getElementById('amt'); if(f){ f.value = v; f.focus(); } }
});
document.getElementById('lang').addEventListener('click', () => {
  S.lang = LANGS[(LANGS.indexOf(S.lang) + 1) % LANGS.length];
  localStorage.setItem('bankrate-m-lang', S.lang);
  T = D[S.lang];
  document.documentElement.lang = S.lang;
  render();
});

document.addEventListener('keydown', e => { if(e.key === 'Escape' && (S.sheet != null || S.about)){ S.sheet = null; S.about = false; render(); } });

document.addEventListener('change', e => {
  if(e.target.id === 'bank'){ S.bank = Number(e.target.value); render(); }
});

window.addEventListener('online', () => { S.online = true; load().catch(() => render()); });
window.addEventListener('offline', () => { S.online = false; render(); });

// The manifest starts at /m/, so this is the copy that lands on a home screen — and until now it was
// the one build that could not open without a connection, because only the desktop entry point ever
// registered the worker. Rates move every three hours: an hour-old figure is still the right figure,
// and the banner above says how old it is.
if('serviceWorker' in navigator){
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
}

load().catch(() => {
  document.getElementById('app').innerHTML = `<div class="card" style="margin-top:40px">${T.loadFailed}</div>`;
});
</script>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d15">
<title>Курс сегодня — BankRate TJ</title>
<link rel="manifest" href="/manifest.webmanifest">
<style>
/* Values are the mock's own, read out of its editable parameters rather than sampled from a
   screenshot. Everything is a film of the text colour over a near-black ground: no solid fills,
   because a screen of eight bank cards has to read as one surface, not eight boxes. */
:root{
  --bg:#0b0d15; --glass:rgba(242,244,250,.05); --glass-soft:rgba(242,244,250,.032);
  --edge:inset 0 1px 0 rgba(242,244,250,.09), 0 0 0 1px rgba(242,244,250,.055);
  --edge-lit:inset 0 1px 0 rgba(242,244,250,.14), 0 0 0 1px rgba(242,244,250,.07), 0 20px 46px rgba(0,0,0,.4);
  --acc:#6ee7ff; --acc-wash:rgba(110,231,255,.1);
  --acc-edge:inset 0 1px 0 rgba(110,231,255,.3), 0 0 0 1px rgba(110,231,255,.34), 0 0 22px rgba(110,231,255,.16);
  --text:#f2f4fa; --dim:#a4aabd; --faint:#8b91a4; --rad:22px;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono","Roboto Mono",monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font:15px/1.45 "Inter",system-ui,-apple-system,sans-serif;
  padding:0 16px calc(84px + env(safe-area-inset-bottom));overflow-x:hidden}
/* Figures in the monospace face throughout: down a column of eight banks the digits line up, which
   turns comparing 9,22 against 9,18 into a glance rather than a reading. */
.n{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.card{background:var(--glass);border-radius:var(--rad);box-shadow:var(--edge);padding:16px}
.soft{background:var(--glass-soft);border-radius:var(--rad);box-shadow:var(--edge)}
h1{font-size:26px;font-weight:600;margin:18px 0 4px}
.sub{color:var(--faint);font-size:13px;margin-bottom:16px}
.lbl{font-size:12.5px;color:var(--faint)}
.row{display:flex;gap:8px}
.row>*{flex:1}
.big{font-size:30px;font-weight:600;margin-top:6px}
.mid{font-size:16px;margin-top:5px}
.pill{height:50px;border-radius:999px;border:0;font:inherit;font-size:15px;display:flex;
  align-items:center;justify-content:center;gap:8px;cursor:pointer;
  color:var(--dim);background:var(--glass-soft);box-shadow:var(--edge)}
.pill.on{color:var(--acc);background:var(--acc-wash);box-shadow:var(--acc-edge)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;height:38px;padding:0 16px;border-radius:999px;border:0;font:inherit;font-size:13.5px;
  color:var(--dim);background:var(--glass-soft);box-shadow:var(--edge);cursor:pointer}
.chip.on{color:var(--acc);background:var(--acc-wash);box-shadow:var(--acc-edge)}
.bank{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:14px 16px;
  background:var(--glass);border-radius:var(--rad);box-shadow:var(--edge);margin-bottom:8px;width:100%;
  border:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.bank .nm{font-size:14.5px}
.bank .v{font-size:15px;text-align:right;min-width:64px}
.best{color:var(--acc)}
input,select{width:100%;height:50px;border-radius:var(--rad);border:0;padding:0 16px;font:inherit;
  color:var(--text);background:var(--glass-soft);box-shadow:var(--edge);outline:none}
input.n{font-size:19px}
nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;
  padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:rgba(11,13,21,.92);
  backdrop-filter:blur(16px);box-shadow:0 -1px 0 rgba(242,244,250,.06)}
nav button{border:0;background:none;font:inherit;font-size:11.5px;color:var(--faint);padding:8px 0 6px;
  display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;min-height:52px}
nav button.on{color:var(--acc)}
nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
.hide{display:none}
.note{font-size:12.5px;color:var(--faint);margin-top:12px}
/* Amber rather than red: the figure is published and real, it is just the state's average and
   not what the counter quotes. Red would claim it is wrong. */
.nbtbadge{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;font-size:11px;
  color:#ffd166;background:rgba(255,209,102,.12);box-shadow:0 0 0 1px rgba(255,209,102,.3)}
/* A marked bank keeps its place in the list rather than jumping to the top. On a list of eight the
   reorder costs more than it saves: the reader loses the position they had just learned. */
.fav{display:inline-block;width:7px;height:7px;border-radius:2px;background:var(--acc);
  margin-left:7px;vertical-align:middle}
.favbtn{width:34px;height:34px;border-radius:999px;border:0;background:var(--glass-soft);
  box-shadow:var(--edge);color:var(--dim);font-size:15px;cursor:pointer;flex:0 0 auto}
.favbtn.on{color:var(--acc);background:var(--acc-wash);box-shadow:var(--acc-edge)}
/* The amount is typed on a keypad the page owns rather than the system keyboard. On a phone the
   OS keyboard covers half the screen and pushes the result — the number being typed towards — out
   of sight, which is the one thing that must stay visible while typing. */
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.pad button{height:58px;border-radius:18px;border:0;font:inherit;font-size:22px;color:var(--text);
  background:var(--glass);box-shadow:var(--edge);cursor:pointer}
.pad button:active{background:var(--acc-wash);box-shadow:var(--acc-edge);color:var(--acc)}
.cpill{height:38px;padding:0 14px;border-radius:999px;border:0;font:inherit;font-size:14px;
  color:var(--acc);background:var(--acc-wash);box-shadow:var(--acc-edge);cursor:pointer;flex:0 0 auto}
.amt{font-size:42px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.got{font-size:38px;font-weight:600;letter-spacing:-.02em;color:var(--acc);line-height:1.1}
/* The active tab sits in a capsule, so which screen you are on is legible at a glance rather than
   by comparing two shades of the same colour. */
nav button span.cap{display:flex;align-items:center;justify-content:center;width:56px;height:34px;
  border-radius:999px;transition:background .16s ease, box-shadow .16s ease}
nav button.on span.cap{background:var(--acc-wash);box-shadow:var(--acc-edge)}
/* The sheet answers "what exactly does this bank offer" without leaving the list behind — the page
   stays visible and dimmed underneath, so closing it returns the reader exactly where they were
   rather than to a screen they have to re-orient in. */
.scrim{position:fixed;inset:0;background:rgba(5,6,10,.62);backdrop-filter:blur(2px);z-index:40;
  animation:fade .2s ease both}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:#12141d;
  border-radius:26px 26px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));
  box-shadow:0 -20px 46px rgba(0,0,0,.5), inset 0 1px 0 rgba(242,244,250,.09);
  max-height:88vh;overflow-y:auto;animation:up .26s cubic-bezier(.2,.8,.2,1) both}
.grab{width:36px;height:4px;border-radius:999px;background:rgba(242,244,250,.18);margin:0 auto 14px}
.srow{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:baseline;padding:11px 0;
  box-shadow:inset 0 -1px 0 rgba(242,244,250,.05)}
.srow .v{min-width:62px;text-align:right;font-size:15px}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.link{border:0;background:none;font:inherit;font-size:13.5px;color:var(--acc);cursor:pointer;padding:0}
.brow{display:flex;gap:12px;align-items:center;width:100%;padding:11px 16px;border:0;background:none;
  font:inherit;font-size:15px;color:inherit;text-align:left;cursor:pointer}
/* The mock keeps one soft accent glow behind the top-left corner — the single piece of colour on
   the ground, sized and blurred so it reads as depth rather than as decoration. */
.blob{position:fixed;width:360px;height:360px;left:-120px;top:-110px;border-radius:50%;
  background:radial-gradient(circle, rgba(110,231,255,.22), transparent 70%);filter:blur(80px);
  pointer-events:none;z-index:-1}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#app{animation:rise .3s ease both}
/* 56px, title and controls on one line — not a page heading stacked above the content. */
header{height:56px;display:flex;align-items:center;gap:8px;padding:0 4px;position:sticky;top:0;
  background:var(--bg);z-index:10}
header .ttl{flex:1;min-width:0;font-size:20px;font-weight:600;letter-spacing:-.03em}
header button{height:34px;padding:0 14px;border-radius:999px;border:0;font:inherit;font-size:13px;
  color:#c8cddb;background:var(--glass-soft);box-shadow:var(--edge);cursor:pointer}
/* Currencies are one segmented control, not loose chips: the three are a single choice. */
.seg{display:flex;gap:6px;padding:3px;border-radius:999px;background:var(--glass-soft);
  box-shadow:var(--edge);margin-bottom:14px}
.seg button{flex:1;height:38px;border-radius:999px;border:0;font:inherit;font-size:13.5px;
  color:var(--dim);background:none;cursor:pointer}
.seg button.on{color:var(--acc);background:var(--acc-wash);box-shadow:var(--acc-edge)}
</style>
</head>
<body>

<div class="blob"></div>
<header><div class="ttl" id="ttl"></div><button id="lang" title="Язык"></button><button id="map" title="Банкоматы" style="width:34px;padding:0">◎</button></header>
<main id="app"><div class="sub" style="margin-top:40px">Загружаю курсы…</div></main>

<nav id="nav"></nav>

<script>
const LANGS = ['ru','tj','uz'];
const D = {
  ru:{official:'официальный курс',officialNote:'Банк не публикует свой курс — показан официальный курс НБТ. В кассе он может отличаться.',navHome:'Курс',navRates:'Банки',navConv:'Счёт',navLimits:'Лимиты',
    titleHome:'Курс сегодня',titleRates:'Банки',titleConv:'Конвертер',titleLimits:'Лимиты карт',
    bestBuy:'Лучше всего продать',bestSell:'Дешевле всего купить',
    buy:'Покупка',sell:'Продажа',bank:'Банк',allBanks:'Все банки',more:'Все курсы',search:'Найти банк',
    compare:'Сравнить',clear:'Убрать сравнение',pickTwo:'Отметьте два банка — покажу их рядом',
    iGive:'Отдаю',iGet:'Получаю',rateUsed:'Курс банка',pickBank:'Банк для расчёта',
    perDay:'В день',perMonth:'В месяц',fee:'Комиссия',card:'Карта',
    updated:'Курс обновлён',currency:'Валюта',convertHere:'Считать по этому банку',close:'Закрыть',
    noData:'Нет данных',cards:'карт',fav:'В избранное',unfav:'Убрать из избранного',
    ownAtm:'Свои банкоматы',otherAtm:'Другие банкоматы',abroad:'За рубежом',
    limitsNote:'Лимиты по тарифам банков. Перед крупным снятием уточните в банке.',
    source:'Курсы с сайтов и API самих банков. Обновляются каждые 3 часа.'},
  tj:{official:'қурби расмӣ',officialNote:'Бонк қурби худро нашр намекунад — қурби расмии БМТ нишон дода шудааст. Дар касса метавонад фарқ кунад.',navHome:'Қурб',navRates:'Бонкҳо',navConv:'Ҳисоб',navLimits:'Лимитҳо',
    titleHome:'Қурби имрӯз',titleRates:'Бонкҳо',titleConv:'Табдилдиҳанда',titleLimits:'Лимитҳои кортҳо',
    bestBuy:'Беҳтарин ҷой барои фурӯш',bestSell:'Арзонтарин харид',
    buy:'Харид',sell:'Фурӯш',bank:'Бонк',allBanks:'Ҳама бонкҳо',more:'Ҳама қурбҳо',search:'Бонкро ёбед',
    compare:'Муқоиса',clear:'Муқоисаро тоза кунед',pickTwo:'Ду бонкро интихоб кунед — паҳлӯи ҳам нишон медиҳам',
    iGive:'Медиҳам',iGet:'Мегирам',rateUsed:'Қурби бонк',pickBank:'Бонк барои ҳисоб',
    perDay:'Дар як рӯз',perMonth:'Дар як моҳ',fee:'Комиссия',card:'Корт',
    updated:'Қурб нав шуд',currency:'Асъор',convertHere:'Бо ин бонк ҳисоб кардан',close:'Пӯшидан',
    noData:'Маълумот нест',cards:'корт',fav:'Ба баргузидаҳо',unfav:'Аз баргузидаҳо гирифтан',
    ownAtm:'Банкоматҳои худӣ',otherAtm:'Банкоматҳои дигар',abroad:'Дар хориҷа',
    limitsNote:'Лимитҳо аз рӯи тарифи бонкҳо. Пеш аз гирифтани маблағи калон бо бонк муайян кунед.',
    source:'Қурбҳо аз сомонаҳо ва API-и худи бонкҳо. Ҳар 3 соат нав мешаванд.'},
  uz:{official:'rasmiy kurs',officialNote:'Bank o\'z kursini e\'lon qilmaydi — MBT rasmiy kursi ko\'rsatilgan. Kassada farq qilishi mumkin.',navHome:'Kurs',navRates:'Banklar',navConv:'Hisob',navLimits:'Limitlar',
    titleHome:'Bugungi kurs',titleRates:'Banklar',titleConv:'Konverter',titleLimits:'Karta limitlari',
    bestBuy:'Sotish uchun eng yaxshi joy',bestSell:'Eng arzon xarid',
    buy:'Xarid',sell:'Sotuv',bank:'Bank',allBanks:'Barcha banklar',more:'Barcha kurslar',search:'Bankni toping',
    compare:'Solishtirish',clear:'Solishtirishni olib tashlash',pickTwo:'Ikkita bankni belgilang — yonma-yon ko\'rsataman',
    iGive:'Beraman',iGet:'Olaman',rateUsed:'Bank kursi',pickBank:'Hisob uchun bank',
    perDay:'Kuniga',perMonth:'Oyiga',fee:'Komissiya',card:'Karta',
    updated:'Kurs yangilandi',currency:'Valyuta',convertHere:'Shu bank bo\'yicha hisoblash',close:'Yopish',
    noData:'Ma\'lumot yo\'q',cards:'karta',fav:'Saralanganlarga',unfav:'Saralanganlardan olib tashlash',
    ownAtm:'O\'z bankomatlari',otherAtm:'Boshqa bankomatlar',abroad:'Chet elda',
    limitsNote:'Limitlar banklar tariflari bo\'yicha. Katta summa olishdan oldin bankda aniqlang.',
    source:'Kurslar banklarning o\'z saytlari va API\'laridan. Har 3 soatda yangilanadi.'}
};

// The choice outlives the session: someone who reads Tajik reads Tajik every time, and asking them
// to pick again on each visit is asking them to notice the site is in the wrong language first.
let T = D[localStorage.getItem('bankrate-m-lang') || 'ru'] || D.ru;

const CUR = ['USD','RUB','EUR'];
const CUR_NAME = {USD:'Доллар США', RUB:'Российский рубль', EUR:'Евро'};
const fmt = (v,c) => v == null ? '—' : v.toFixed(c === 'RUB' ? 4 : 2).replace('.', ',');
const el = h => { const d = document.createElement('div'); d.innerHTML = h; return d; };

const S = { favs: JSON.parse(localStorage.getItem('bankrate-m-favs') || '[]'), lang: localStorage.getItem('bankrate-m-lang') || 'ru', sheet:null, compareMode:false, compare:[], tab:'home', cur:'USD', q:'', amount:'1000', from:'USD', dir:'buy', bank:null, rates:[], limits:[] };

async function load(){
  const [r,l] = await Promise.all([
    fetch('/data/rates.json').then(x=>x.json()),
    fetch('/data/limits.json').then(x=>x.json()).catch(()=>({data:[]}))
  ]);
  S.rates = r.data || [];
  S.limits = l.data || [];
  S.bank = S.rates[0]?.bankId ?? null;
  render();
}

const val = (r,c,side) => r[c.toLowerCase() + (side === 'buy' ? 'Buy' : 'Sell')];

// Best to sell = the bank paying most for your currency. Best to buy = the bank charging least.
// Named from the reader's side, because "лучший курс покупки" describes what the bank does and
// sends people to the wrong side of the spread.
function best(c){
  const list = S.rates.filter(r => val(r,c,'buy') != null);
  if(!list.length) return null;
  return {
    sell: list.reduce((a,b)=> val(b,c,'buy') > val(a,c,'buy') ? b : a),
    buy:  list.reduce((a,b)=> val(b,c,'sell') < val(a,c,'sell') ? b : a)
  };
}

function screenHome(){
  const b = best(S.cur);
  if(!b) return '<div class="card">${T.noData}</div>';
  return `
  <div class="sub">${CUR_NAME[S.cur]}</div>
  <div class="seg">
    ${CUR.map(c=>`<button class="${c===S.cur?'on':''}" data-cur="${c}">${c}</button>`).join('')}
  </div>
  <div class="row" style="margin-bottom:8px">
    <div class="card">
      <div class="lbl">${T.bestBuy}</div>
      <div class="big n best">${fmt(val(b.sell,S.cur,'buy'),S.cur)}</div>
      <div class="lbl" style="margin-top:6px">${b.sell.bank.nameRu}</div>
    </div>
    <div class="card">
      <div class="lbl">${T.bestSell}</div>
      <div class="big n">${fmt(val(b.buy,S.cur,'sell'),S.cur)}</div>
      <div class="lbl" style="margin-top:6px">${b.buy.bank.nameRu}</div>
    </div>
  </div>
  <div class="card" style="margin-top:8px;padding:16px 0">
    <div style="display:flex;align-items:baseline;justify-content:space-between;padding:0 16px 12px">
      <div style="font-size:17px;font-weight:600">${T.allBanks}</div>
      <button data-tab="rates" class="link">${T.more} →</button>
    </div>
    <div class="row lbl" style="padding:0 16px 8px">
      <div>${T.bank}</div>
      <div style="text-align:right;flex:0 0 62px">${T.buy}</div>
      <div style="text-align:right;flex:0 0 62px">${T.sell}</div>
    </div>
    ${S.rates.map(r=>`
      <button class="brow" data-bank="${r.bankId}">
        <div style="flex:1;min-width:0;font-size:14.5px">${r.bank.nameRu}${S.favs.includes(r.bankId)?'<span class="fav"></span>':''}</div>
        <div class="n ${r.bankId===b.sell.bankId?'best':''}" style="flex:0 0 62px;text-align:right">${fmt(val(r,S.cur,'buy'),S.cur)}</div>
        <div class="n ${r.bankId===b.buy.bankId?'best':''}" style="flex:0 0 62px;text-align:right">${fmt(val(r,S.cur,'sell'),S.cur)}</div>
      </button>`).join('')}
    <div class="lbl" style="padding:10px 16px 0">${T.source}</div>
  </div>`;
}

// Two banks side by side, every currency at once. Choosing between banks is the actual decision
// this product exists to support, and scrolling a list comparing one column at a time is how people
// lose track of which was better — the answer changes depending on the currency they hold.
function comparePanel(){
  const picked = S.compare.map(id => S.rates.find(r => r.bankId === id)).filter(Boolean);
  if(picked.length < 2) return `<div class="note" style="margin:0 0 12px">${T.pickTwo}</div>`;

  const [a, c] = picked;
  return `
  <div class="card" style="margin-bottom:12px">
    <div class="row lbl" style="margin-bottom:10px">
      <div style="flex:0 0 44px"></div>
      <div style="text-align:right">${a.bank.nameRu}</div>
      <div style="text-align:right">${c.bank.nameRu}</div>
    </div>
    ${CUR.map(cur => ['buy','sell'].map(side => {
      const va = val(a,cur,side), vc = val(c,cur,side);
      // Better for the reader: selling into the higher bid, buying at the lower ask.
      const aWins = side === 'buy' ? va > vc : va < vc;
      return `<div class="row" style="margin-bottom:6px;align-items:baseline">
        <div class="lbl" style="flex:0 0 44px">${cur} ${side === 'buy' ? '↓' : '↑'}</div>
        <div class="n ${va !== vc && aWins ? 'best' : ''}" style="text-align:right">${fmt(va,cur)}</div>
        <div class="n ${va !== vc && !aWins ? 'best' : ''}" style="text-align:right">${fmt(vc,cur)}</div>
      </div>`;
    }).join('')).join('')}
    <div class="lbl" style="margin-top:10px">↓ ${T.buy} · ↑ ${T.sell}</div>
  </div>`;
}

function screenRates(){
  const q = S.q.toLowerCase();
  const list = S.rates.filter(r => !q || r.bank.nameRu.toLowerCase().includes(q));
  const b = best(S.cur);
  return `
  <div class="sub">${list.length} / ${S.rates.length}</div>
  <input id="q" placeholder="${T.search}" value="${S.q}" style="margin-bottom:10px">
  <button class="pill ${S.compareMode?'on':''}" data-cmp="toggle" style="width:100%;margin-bottom:10px">
    ${S.compareMode ? T.clear : T.compare}
  </button>
  ${S.compareMode ? comparePanel() : ''}
  <div class="seg">
    ${CUR.map(c=>`<button class="${c===S.cur?'on':''}" data-cur="${c}">${c}</button>`).join('')}
  </div>
  <div class="row lbl" style="padding:0 16px 6px"><div></div>
    <div style="text-align:right;flex:0 0 64px">${T.buy}</div>
    <div style="text-align:right;flex:0 0 64px">${T.sell}</div></div>
  ${list.map(r=>`
    <button class="bank" data-bank="${r.bankId}" style="${S.compareMode && S.compare.includes(r.bankId) ? 'box-shadow:var(--acc-edge)' : ''}">
      <div><div class="nm">${r.bank.nameRu}${S.favs.includes(r.bankId)?'<span class="fav"></span>':''}</div><div class="lbl">${r.sourceLabel}${r.sourceLabel.startsWith('НБТ')?`<span class="nbtbadge">${T.official}</span>`:''}</div></div>
      <div class="v n ${b && r.bankId===b.sell.bankId?'best':''}">${fmt(val(r,S.cur,'buy'),S.cur)}</div>
      <div class="v n ${b && r.bankId===b.buy.bankId?'best':''}">${fmt(val(r,S.cur,'sell'),S.cur)}</div>
    </button>`).join('')}`;
}

function screenConv(){
  if(!S.rates.length) return '<div class="card">Нет данных</div>';
  return (() => {
    const r = S.rates.find(x=>x.bankId===S.bank) || S.rates[0];
    const other = S.from === 'TJS' ? S.cur : S.from;
    const rate = val(r, other, S.dir);
    const amt = parseFloat(String(S.amount || '0').replace(',','.')) || 0;
    const out = S.from === 'TJS' ? (rate ? amt / rate : 0) : amt * rate;
    const grp = n => n.toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    return `
    <div class="card">
      <div style="display:flex;align-items:center;gap:10px">
        <div class="amt n" style="flex:1;min-width:0;overflow:hidden">${S.amount || '0'}</div>
        <button class="cpill" data-swapcur="1">${S.from} ⇅</button>
      </div>
      <div style="display:flex;justify-content:flex-end;margin-top:10px">
        <button class="chip" data-dir="1">⇵ ${S.dir === 'buy' ? T.buy : T.sell}</button>
      </div>
      <div style="height:1px;background:rgba(242,244,250,.06);margin:14px 0"></div>
      <div style="display:flex;align-items:center;gap:10px">
        <div style="flex:1;min-width:0">
          <div class="lbl" style="color:var(--acc)">${T.iGet}</div>
          <div class="got n">${grp(out)}</div>
        </div>
        <div class="chip" style="pointer-events:none">${S.from === 'TJS' ? other : 'TJS'}</div>
      </div>
    </div>

    <div class="lbl" style="margin:14px 0 8px">${T.pickBank}</div>
    <div class="chips">
      ${S.rates.map(x=>`<button class="chip ${x.bankId===S.bank?'on':''}" data-bank2="${x.bankId}">${x.bank.shortName ? x.bank.nameRu.split(' ')[0] : x.bank.nameRu}</button>`).join('')}
    </div>

    <div class="soft" style="display:flex;justify-content:space-between;align-items:center;padding:14px 16px;margin-top:10px">
      <div class="lbl">${T.rateUsed}</div><div class="n" style="font-size:16px">${fmt(rate, other)}</div>
    </div>

    <div class="pad">
      ${['1','2','3','4','5','6','7','8','9','.','0','⌫'].map(k=>`<button data-key="${k}">${k}</button>`).join('')}
    </div>`;
  })();
}

function screenLimits(){
  if(!S.limits.length) return '<div class="card">' + T.noData + '</div>';

  // Grouped by bank, because the question is "what does my bank allow", not "list every card in
  // the country" — and a bank with two cards should read as one entry with two, not as two banks.
  const byBank = {};
  S.limits.forEach(l => { (byBank[l.bank.nameRu] = byBank[l.bank.nameRu] || []).push(l); });

  return `
  <div class="sub" style="margin-top:2px">${S.limits.length} ${T.cards}</div>
  ${Object.entries(byBank).map(([name, cards]) => `
    <div class="card" style="margin-bottom:10px">
      <div style="font-size:17px;font-weight:600;margin-bottom:2px">${name}</div>
      ${cards.map(l => `
        <div style="margin-top:14px">
          <div class="lbl">${l.cardType} · ${l.cardName}</div>
          <div class="row" style="margin-top:8px">
            <div class="soft" style="padding:13px 16px"><div class="lbl">${T.perDay}</div><div class="mid n">${l.dailyLimit}</div></div>
            <div class="soft" style="padding:13px 16px"><div class="lbl">${T.perMonth}</div><div class="mid n">${l.monthlyLimit}</div></div>
          </div>
          <div class="row" style="margin-top:8px">
            <div class="soft" style="padding:13px 16px"><div class="lbl">${T.ownAtm}</div><div class="mid n">${l.ownAtmNote}</div></div>
            <div class="soft" style="padding:13px 16px"><div class="lbl">${T.otherAtm}</div><div class="mid n">${l.otherAtmNote}</div></div>
          </div>
          <div class="soft" style="padding:13px 16px;margin-top:8px"><div class="lbl">${T.abroad}</div><div class="mid n">${l.abroadNote}</div></div>
          ${l.noteRu ? `<div class="lbl" style="margin-top:10px">${S.lang==='tj'?(l.noteTj||l.noteRu):S.lang==='uz'?(l.noteUz||l.noteRu):l.noteRu}</div>` : ''}
        </div>`).join('')}
    </div>`).join('')}
  <div class="note">${T.limitsNote}</div>`;
}

const ICON = {
  home:'<path d="M3.5 10.5 12 4l8.5 6.5V19a1.5 1.5 0 0 1-1.5 1.5h-4.5V15h-5v5.5H5A1.5 1.5 0 0 1 3.5 19z"/>',
  rates:'<path d="M4 20V11M9.3 20V6M14.7 20v-6M20 20V9"/>',
  conv:'<path d="M4 8.5h14M14.5 5 18 8.5 14.5 12M20 15.5H6M9.5 12 6 15.5 9.5 19"/>',
  limits:'<rect x="2.5" y="5.5" width="19" height="13" rx="2.5"/><path d="M2.5 10h19M6 15h3"/>'
};


// Rendered outside the screen switch so it floats over whichever tab is open.
function sheetHtml(){
  const r = S.rates.find(x => x.bankId === S.sheet);
  if(!r) return '';

  const lim = S.limits.find(l => l.bank.slug === r.bank.slug);
  const ago = (() => {
    const mins = Math.round((Date.now() - new Date(r.updatedAt).getTime()) / 60000);
    if(mins < 1) return 'только что';
    if(mins < 60) return mins + ' мин назад';
    const h = Math.round(mins / 60);
    return h < 24 ? h + ' ч назад' : Math.round(h / 24) + ' дн назад';
  })();

  return `
  <div class="scrim" data-close="1"></div>
  <div class="sheet">
    <div class="grab"></div>
    <div style="display:flex;align-items:center;gap:10px"><div style="flex:1;min-width:0;font-size:20px;font-weight:600;letter-spacing:-.02em">${r.bank.nameRu}</div><button class="favbtn ${S.favs.includes(r.bankId)?'on':''}" data-fav="${r.bankId}" aria-label="${S.favs.includes(r.bankId)?T.unfav:T.fav}">${S.favs.includes(r.bankId)?'★':'☆'}</button></div>
    <div class="lbl" style="margin:4px 0 14px">${T.updated} ${ago}</div>
    ${r.sourceLabel.startsWith('НБТ') ? `<div class="lbl" style="color:#ffd166;margin:-8px 0 14px">${T.officialNote}</div>` : ''}

    <div class="row lbl" style="padding-bottom:6px">
      <div>${T.currency}</div>
      <div class="v" style="flex:0 0 62px;text-align:right">${T.buy}</div>
      <div class="v" style="flex:0 0 62px;text-align:right">${T.sell}</div>
    </div>
    ${CUR.map(c => `
      <div class="srow">
        <div style="font-size:15.5px">${c}<span class="lbl"> · ${CUR_NAME[c]}</span></div>
        <div class="v n">${fmt(val(r,c,'buy'),c)}</div>
        <div class="v n">${fmt(val(r,c,'sell'),c)}</div>
      </div>`).join('')}

    ${lim ? `<div class="row" style="margin-top:14px">
      <div class="soft" style="padding:13px 16px"><div class="lbl">${T.perDay}</div><div class="mid n">${lim.dailyLimit}</div></div>
      <div class="soft" style="padding:13px 16px"><div class="lbl">${T.fee}</div><div class="mid n">${lim.commission}</div></div>
    </div>` : ''}

    <div class="row" style="margin-top:16px">
      <button class="pill on" data-use="${r.bankId}">${T.convertHere}</button>
      <button class="pill" style="flex:0 0 auto;padding:0 22px" data-close="1">${T.close}</button>
    </div>
  </div>`;
}

function render(){
  document.getElementById('app').innerHTML =
    S.tab==='home'?screenHome():S.tab==='rates'?screenRates():S.tab==='conv'?screenConv():screenLimits();
  document.getElementById('nav').innerHTML = [
    ['home',T.navHome],['rates',T.navRates],['conv',T.navConv],['limits',T.navLimits]
  ].map(([k,l])=>`<button class="${S.tab===k?'on':''}" data-tab="${k}">
      <span class="cap"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg></span>${l}</button>`).join('');
  if(S.sheet != null) document.getElementById('app').insertAdjacentHTML('beforeend', sheetHtml());
  document.body.style.overflow = S.sheet != null ? 'hidden' : '';
  document.getElementById('lang').textContent = S.lang.toUpperCase();
  document.getElementById('ttl').textContent = S.tab==='home'?T.titleHome:S.tab==='rates'?T.titleRates:S.tab==='conv'?T.titleConv:T.titleLimits;
  document.title = (S.tab==='home'?T.titleHome:S.tab==='rates'?T.titleRates:S.tab==='conv'?T.titleConv:T.titleLimits) + ' — BankRate TJ';
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-cur],[data-bank],[data-from],[data-cmp],[data-close],[data-use],[data-key],[data-bank2],[data-dir],[data-swapcur],[data-fav]');
  if(!t) return;
  if(t.dataset.fav){
    const id = Number(t.dataset.fav);
    S.favs = S.favs.includes(id) ? S.favs.filter(x=>x!==id) : [...S.favs, id];
    localStorage.setItem('bankrate-m-favs', JSON.stringify(S.favs));
  }
  else if(t.dataset.key){
    const k = t.dataset.key;
    // Typing is capped and the separator kept single, because the field has no browser validation
    // behind it — the page owns the keypad, so the page owns what a valid amount is.
    if(k === '⌫') S.amount = String(S.amount).slice(0, -1) || '';
    else if(k === '.') { if(!String(S.amount).includes('.')) S.amount = (S.amount || '0') + '.'; }
    else if(String(S.amount).replace(/\D/g,'').length < 9) S.amount = (S.amount === '0' ? '' : S.amount) + k;
  }
  else if(t.dataset.bank2) S.bank = Number(t.dataset.bank2);
  else if(t.dataset.dir) S.dir = S.dir === 'buy' ? 'sell' : 'buy';
  else if(t.dataset.swapcur){ const i = ['TJS',...CUR].indexOf(S.from); S.from = ['TJS',...CUR][(i+1) % 4]; }
  else if(t.dataset.close) S.sheet = null;
  else if(t.dataset.use){ S.bank = Number(t.dataset.use); S.sheet = null; S.tab = 'conv'; }
  else if(t.dataset.tab) S.tab = t.dataset.tab;
  else if(t.dataset.cur) S.cur = t.dataset.cur;
  else if(t.dataset.from) S.from = t.dataset.from;
  else if(t.dataset.cmp){ S.compareMode = !S.compareMode; S.compare = []; }
  else if(t.dataset.bank){
    const id = Number(t.dataset.bank);
    if(S.compareMode){
      // Two at a time: a third pick replaces the older of the pair, so the control never dead-ends
      // on a full selection the reader has to clear by hand.
      S.compare = S.compare.includes(id) ? S.compare.filter(x=>x!==id)
        : [...S.compare, id].slice(-2);
    } else { S.sheet = id; }
  }
  render();
  if(S.sheet == null) window.scrollTo(0,0);
});

// Typing must not re-render the field it is typed into, or the caret jumps to the start on every
// keystroke — so the input keeps focus and only the parts that depend on it are recomputed.
document.addEventListener('input', e => {
  if(e.target.id === 'q'){ S.q = e.target.value; const v = e.target.value;
    render(); const f = document.getElementById('q'); if(f){ f.value = v; f.focus(); } }
  if(e.target.id === 'amt'){ S.amount = e.target.value; const v = e.target.value;
    render(); const f = document.getElementById('amt'); if(f){ f.value = v; f.focus(); } }
});
document.getElementById('lang').addEventListener('click', () => {
  S.lang = LANGS[(LANGS.indexOf(S.lang) + 1) % LANGS.length];
  localStorage.setItem('bankrate-m-lang', S.lang);
  T = D[S.lang];
  document.documentElement.lang = S.lang;
  render();
});

// Nothing behind this yet — the mock shows nearby ATMs and we have no location data, so it says
// so rather than opening an empty screen that looks broken.
document.getElementById('map').addEventListener('click', () => {
  alert(S.lang === 'ru' ? 'Банкоматы появятся позже' : S.lang === 'tj' ? 'Банкоматҳо баъдтар' : 'Bankomatlar keyinroq');
});

document.addEventListener('keydown', e => { if(e.key === 'Escape' && S.sheet != null){ S.sheet = null; render(); } });

document.addEventListener('change', e => {
  if(e.target.id === 'bank'){ S.bank = Number(e.target.value); render(); }
});

load().catch(() => {
  document.getElementById('app').innerHTML = '<div class="card" style="margin-top:40px">Не удалось загрузить курсы</div>';
});
</script>
</body>
</html>

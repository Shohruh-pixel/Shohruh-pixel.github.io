    <path d="M44 42H69C80.598 42 90 51.402 90 63C90 74.598 80.598 84 69 84H44V42Z" fill="white" fill-opacity="0.22"/>
    <path d="M52 50H68.5C76.5081 50 83 56.4919 83 64.5C83 72.5081 76.5081 79 68.5 79H52V50Z" fill="white"/>
  </g>
  <defs>
    <linearGradient id="maskableBg" x1="9" y1="10.5" x2="112.5" y2="121.5" gradientUnits="userSpaceOnUse">

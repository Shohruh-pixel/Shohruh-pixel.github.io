# Reverse proxy for BankRate TJ.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/bankrate
#   sudo ln -sf /etc/nginx/sites-available/bankrate /etc/nginx/sites-enabled/bankrate
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then add TLS (this rewrites the file in place to add the 443 block):
#   sudo certbot --nginx -d example.tj -d www.example.tj

server {
    listen 80;
    listen [::]:80;
    server_name example.tj www.example.tj;

    # Tajik mobile connections are among the slowest in the world, so compressing the HTML and
    # JS shaves real seconds off first paint rather than being a micro-optimisation.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 512;

    # The app itself sets no-store on the HTML shell (it carries live rates) and immutable
    # caching on hashed assets, so proxy buffering can simply pass those decisions through.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}

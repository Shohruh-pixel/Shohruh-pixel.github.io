# Reverse proxy for the pre-domain phase: the site answers on the machine's bare public IP.
#
#   sudo cp deploy/nginx-ip.conf /etc/nginx/sites-available/bankrate
#   sudo ln -sf /etc/nginx/sites-available/bankrate /etc/nginx/sites-enabled/bankrate
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# This file exists separately from nginx.conf rather than replacing it, because certbot edits the
# config in place and matches on server_name: a catch-all `_` gives it nothing to attach a
# certificate to. Once a domain points here, switch to deploy/nginx.conf and run certbot against
# that instead.
#
# An IP-only site cannot have TLS (no certificate authority issues for a bare address), so this is
# a staging state, not a launch state — search engines and Telegram both treat plain HTTP as a
# downgrade.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    # Catch-all: answers on the public IP whatever hostname the request carries.
    server_name _;

    # Tajik mobile connections are among the slowest in the world, so compressing the HTML and
    # JS shaves real seconds off first paint rather than being a micro-optimisation.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 512;

    # The app itself sets no-store on the HTML shell (it carries live rates) and immutable
    # caching on hashed assets, so proxy buffering can simply pass those decisions through.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}

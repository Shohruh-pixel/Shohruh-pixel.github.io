# Builds the site and publishes it to GitHub Pages.
#
# This replaces the always-on server: instead of a process that scrapes every 15 minutes and
# answers requests, a job scrapes on a schedule and writes the answers to files. The application
# code is unchanged — the build starts the real Express app on a throwaway port and saves what it
# returns, so the rates, the best-rate picks and the per-route titles all come from the code that
# the test suite already covers.
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    # Every three hours. The National Bank publishes roughly once per business day and dc.tj is
    # similar, so this is already several times more often than the sources actually move; going
    # tighter would spend minutes to re-publish identical numbers.
    - cron: "0 */3 * * *"
  workflow_dispatch:

# Pages deployment needs id-token; committing the rate snapshot back needs contents: write.
permissions:
  contents: write
  pages: write
  id-token: write

# A scheduled run and a push can overlap, and letting both publish would mean the older build lands
# last and puts stale rates on the site. Queueing fixes that on its own: GitHub runs one at a time
# and keeps only the newest of whatever is waiting, so the freshest build is still the one that ends
# up published.
#
# In-progress runs are deliberately not cancelled. Cutting one off during actions/deploy-pages leaves
# a half-created deployment behind, and the next run fails on it — which is what happened here: a
# green build whose publish step failed, leaving the previous site up while the commit looked
# delivered. A slow deploy is cheaper than a deploy that breaks the one after it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # NODE_ENV is deliberately NOT set to production for the whole job: `npm ci` reads it and
      # omits devDependencies, which is where Vite lives. The frontend build would then fail on a
      # missing binary, in a step far from the line that caused it. It is set per-step instead.
      #
      # Written to a path outside the repository so a stray `git add -A` can never commit a
      # database file; the snapshot JSON is the only thing that persists between runs.
      DATABASE_URL: file:/tmp/bankrate-build.db

      # Read from repository secrets, never written down here — this file is committed and the
      # repository is public, so a token in it would be a token anyone can use. Absent secrets are
      # not an error: notify.service.js simply stays quiet when either value is missing, which is
      # the normal state locally.
      #
      # Without these, a bank that redesigns its site turns the build red and nothing says so; the
      # rates quietly stop moving and the site keeps serving figures that look current. That is the
      # worst failure this project can have, and it is the one alerting exists to prevent.
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve the public URL
        # Canonical links, Open Graph tags and every sitemap entry are absolute, so this value ends
        # up published. Getting it wrong is invisible in a browser and wrong for every crawler.
        #
        # A user site (<owner>.github.io) is served from the root, which is what the app assumes:
        # its routes and asset links are absolute paths. A project repository is served from
        # /<repo>/ instead, and would need a base path threaded through Vite and the router — so
        # rather than publish a site with broken links, this stops and says what to do.
        run: |
          # Lowercased: GitHub serves the site from the lowercase host regardless of how the
          # account name is capitalised. A canonical link or sitemap entry carrying the mixed-case
          # form resolves, but hands a crawler a second spelling of every URL for no reason.
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')

          if [ -n "${{ vars.PUBLIC_URL }}" ]; then
            echo "PUBLIC_URL=${{ vars.PUBLIC_URL }}" >> "$GITHUB_ENV"
          elif [ "$REPO" = "$OWNER.github.io" ]; then
            echo "PUBLIC_URL=https://$OWNER.github.io" >> "$GITHUB_ENV"
          else
            echo "::error::This repository is '${{ github.event.repository.name }}', which GitHub serves from a subpath (/${{ github.event.repository.name }}/). The app is built for a site at the domain root. Either rename the repository to '${{ github.repository_owner }}.github.io', or set a repository variable PUBLIC_URL to your custom domain."
            exit 1
          fi


      - name: Install dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Prepare the database
        run: |
          npx prisma generate
          npx prisma migrate deploy
          node prisma/seed.js
        working-directory: backend

      - name: Restore rates and history
        # The database is created fresh every run. Rate movement is derived from RateHistory, so
        # without this restore there would never be a second recorded value to compare against and
        # the site could never show whether a rate rose or fell.
        run: npm run snapshot:import --prefix backend

      - name: Fetch current rates
        # A failure here is not fatal on purpose: the restored snapshot still holds the last known
        # good rates, and publishing those with an honest timestamp beats failing the deploy and
        # leaving whatever is already live. The scraper records its own failure either way.
        run: npm run scrape --prefix backend || echo "::warning::Scrape failed; publishing the previous snapshot."

      - name: Build the app shell
        # Must precede the tests. Express serves pages only when frontend/dist/index.html exists —
        # without it the catch-all route is never registered, and the six tests covering the
        # server-rendered pages and the 404 fail for a reason that has nothing to do with the code
        # they are testing.
        run: npm run build:static --prefix frontend

      - name: Run tests
        # After the scrape, so a source that changed its markup in a way the parser mishandles is
        # caught before the numbers reach the site rather than after.
        run: npm test --prefix backend

      - name: Save rates and history
        run: npm run snapshot:export --prefix backend

      - name: Prerender the site
        env:
          NODE_ENV: production
        run: npm run build:static --prefix backend

      - name: Commit the snapshot
        # Pushes made with GITHUB_TOKEN do not trigger workflows, so this cannot loop back into
        # another run. The rate history therefore lives in git: a published figure cannot be
        # quietly changed later, because changing it shows up as a diff.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot.json
          if git diff --staged --quiet; then
            echo "No rate changes to record."
          else
            git commit -m "chore: record rates $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
            git push
          fi

      - name: Fill in what Telegram shows before Start
        # A bot with no description opens as a blank screen with one button, which reads as a dead
        # end rather than a service. Idempotent like the step below, and never fails the build.
        run: node backend/scripts/set-telegram-profile.js

      - name: Point Telegram's menu button at the mini app
        # Idempotent, so it runs every time rather than once by hand: Telegram stores the last value
        # and setting the same one again changes nothing. Never fails the build — see the script.
        run: node backend/scripts/set-telegram-menu.js

      - uses: actions/upload-pages-artifact@v3
        with:
          # dist-static, not dist: the prerenderer reads Vite's output as its shell and writes the
          # finished pages beside it, so only this directory holds the complete site.
          path: frontend/dist-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Publishing fails now and then — three times this week — on a build that was otherwise green.
      # The failure is inside GitHub's own Pages API and its logs are not readable without a token,
      # so the cause is not something this repository can see. What it can see is the consequence: a
      # commit that reached origin, a run marked failed, and the previous site still live. Every one
      # of those needed a hand-pushed empty commit to clear.
      #
      # So the first attempt is allowed to fail and a second one follows. A retry is not a diagnosis,
      # and it is not being passed off as one; it is what turns a silent half-hour of stale rates into
      # thirty extra seconds. If the second also fails the run goes red, which is the honest outcome.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
